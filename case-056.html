<!DOCTYPE html>
<html lang="en">
	<head>
		<title>舒迈科技</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<style>
			body {
				margin: 0;
				overflow: hidden;
			}

			.status {
				width: 30px;
				height: 30px;
				position: relative;
				cursor: pointer;
			}

			.solid {
				width: 100%;
				height: 100%;
				position: absolute;
				z-index: 999;
				left: 0;
				top: 0;
				background: #fff;
				border-radius: 100%;
			}

			.status .animate1,
			.status .animate2 {
				background: #fff;
				width: 30px;
				height: 30px;
				border-radius: 100%;
				position: absolute;
				left: 0;
				top: 0;
				z-index: 1;
			}

			@keyframes circle {
				0% {
					-webkit-transform: scale(1);
					transform: scale(1);
					opacity: 1;
				}

				100% {
					-webkit-transform: scale(1.8);
					transform: scale(1.8);
					opacity: 0.1;
				}
			}

			.status .animate1 {
				-webkit-animation: circle 2s 0s ease-out infinite running;
				animation: circle 2s 0s ease-out infinite running;
			}

			.status .animate2 {
				-webkit-animation: circle 2s 1s ease-out infinite running;
				animation: circle 2s 1s ease-out infinite running;
			}

			.element_title {
				width: 25px;
				padding: 15px 5px !important;
				background: rgba(43, 53, 78, .2);
				border-top: 2px solid #d39f51;
				border-bottom: 2px solid #d39f51;
				border-left: 1px solid rgba(213, 170, 104, .5);
				border-right: 1px solid rgba(213, 170, 104, .5);
				-webkit-box-shadow: 4px 3px 17px rgb(8 17 39 / 30%);
				box-shadow: 4px 3px 17px rgb(8 17 39 / 30%);
			}

			.title {
				font-size: 25px;
				color: #fff;
				letter-spacing: 3.6px;
				line-height: 30px;
				layout-flow: vertical-ideographic;
				text-align: center;
				font-family: HYQuanTangShiJ;
				cursor: pointer;
			}

			.title:hover {
				color: #fad194;
			}

			.lt_item {
				position: absolute;
				display: flex;
				align-content: center;
				justify-content: center;
				width: 100%;
				height: 100%;
			}

			.lti_layer {
				width: 100%;
				height: 100%;
				display: flex;
				justify-content: center;
				align-items: center;
				background-color: #00000085;
				display: none;
				z-index: 2;
			}

			.lti_haibao img {
				width: 18%;
			}
		</style>
	</head>
	<body>
		<div class="lt_item">
			<div class="lti_haibao lti_layer">
				<img src="assets/bgImage/shumai/haibao.jpg">
			</div>
			<div class="lti_shipin lti_layer">
				<video src="three-home-master/threejs-3d-home-main/example-mp4/pc.mp4" autoplay muted preload
					controls="controls" webkit-playsinline="webkit-playsinline"></video>
			</div>
		</div>
		<div id="container"></div>
		<script src="libs/jquery-1.11.2.min.js"></script>
		<script type="importmap">
			{
				"imports": {
					"three": "./libs/jsm/three.module.js"
				}
			}
		</script>

		<script type="module">
			import * as THREE from 'three';

			import {
				CSS2DRenderer,
				CSS2DObject
			} from './libs/jsm/CSS2DRenderer.js';

			let camera, scene, renderer, renderer2;

			let isUserInteracting = false,
				onPointerDownMouseX = 0,
				onPointerDownMouseY = 0,
				lon = 0,
				onPointerDownLon = 0,
				lat = 0,
				onPointerDownLat = 0,
				phi = 0,
				theta = 0;

			init();
			animate();

			function init() {

				const container = document.getElementById('container');

				camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1100);

				scene = new THREE.Scene();

				const geometry = new THREE.SphereGeometry(500, 60, 40);
				// invert the geometry on the x-axis so that all of the faces point inward
				geometry.scale(-1, 1, 1);

				const texture = new THREE.TextureLoader().load('assets/bgImage/shumai/003.jpg');
				const material = new THREE.MeshBasicMaterial({
					map: texture
				});

				const mesh = new THREE.Mesh(geometry, material);
				scene.add(mesh);

				renderer = new THREE.WebGLRenderer();
				renderer.setPixelRatio(window.devicePixelRatio);
				renderer.setSize(window.innerWidth, window.innerHeight);
				container.appendChild(renderer.domElement);

				renderer2 = new CSS2DRenderer();
				renderer2.domElement.style.position = 'absolute';
				renderer2.domElement.style.top = 0;
				renderer2.setSize(window.innerWidth, window.innerHeight);
				container.appendChild(renderer2.domElement);

				container.style.touchAction = 'none';
				container.addEventListener('pointerdown', onPointerDown);

				document.addEventListener('wheel', onDocumentMouseWheel);

				document.addEventListener('dragover', function(event) {

					event.preventDefault();
					event.dataTransfer.dropEffect = 'copy';

				});

				document.addEventListener('dragenter', function() {

					document.body.style.opacity = 0.5;

				});

				document.addEventListener('dragleave', function() {

					document.body.style.opacity = 1;

				});

				document.addEventListener('drop', function(event) {

					event.preventDefault();

					const reader = new FileReader();
					reader.addEventListener('load', function(event) {

						material.map.image.src = event.target.result;
						material.map.needsUpdate = true;

					});
					reader.readAsDataURL(event.dataTransfer.files[0]);

					document.body.style.opacity = 1;

				});

				// 在屏幕上显示坐标轴
				var axes = new THREE.AxesHelper(100);
				scene.add(axes);

				window.addEventListener('resize', onWindowResize);

				const pos1 = new THREE.Vector3(20, 7, -1);
				const xqgEle = crateElment("兴庆宫", pos1);
				// scene.add(xqgEle);

				const pos2 = new THREE.Vector3(-100, -8, -35);
				const dsEle = crateElmentHaibao("haibao", pos2);
				scene.add(dsEle);

				const pos3 = new THREE.Vector3(100, -10, 40);
				const vEle = crateElmentHaibao("shipin", pos3);
				scene.add(vEle);

			}

			function crateElment(text, pos) {
				const element = document.createElement('div');
				element.className = 'element_title';
				const number = document.createElement('div');
				number.className = 'title';
				number.textContent = text;
				element.appendChild(number);
				const objectCSS = new CSS2DObject(element);
				objectCSS.position.x = pos.x;
				objectCSS.position.y = pos.y;
				objectCSS.position.z = pos.z;
				return objectCSS;
			}

			function crateElmentHaibao(id, pos) {
				const waves = document.createElement('div');
				waves.id = id;
				waves.className = 'status';
				waves.addEventListener('click', haibaoFun, true);

				const solid = document.createElement('div');
				solid.className = 'solid';
				const animate1 = document.createElement('div');
				animate1.className = 'animate1';
				const animate2 = document.createElement('div');
				animate2.className = 'animate2';
				waves.appendChild(solid);
				waves.appendChild(animate1);
				waves.appendChild(animate2);

				const objectCSS = new CSS2DObject(waves);
				objectCSS.position.x = pos.x;
				objectCSS.position.y = pos.y;
				objectCSS.position.z = pos.z;
				return objectCSS;
			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize(window.innerWidth, window.innerHeight);

			}

			function onPointerDown(event) {

				if (event.isPrimary === false) return;

				isUserInteracting = true;

				onPointerDownMouseX = event.clientX;
				onPointerDownMouseY = event.clientY;

				onPointerDownLon = lon;
				onPointerDownLat = lat;

				document.addEventListener('pointermove', onPointerMove);
				document.addEventListener('pointerup', onPointerUp);

			}

			function onPointerMove(event) {

				if (event.isPrimary === false) return;

				lon = (onPointerDownMouseX - event.clientX) * 0.1 + onPointerDownLon;
				lat = (event.clientY - onPointerDownMouseY) * 0.1 + onPointerDownLat;

			}

			function onPointerUp() {

				if (event.isPrimary === false) return;

				isUserInteracting = false;

				document.removeEventListener('pointermove', onPointerMove);
				document.removeEventListener('pointerup', onPointerUp);

			}

			function onDocumentMouseWheel(event) {

				const fov = camera.fov + event.deltaY * 0.05;

				camera.fov = THREE.MathUtils.clamp(fov, 10, 75);

				camera.updateProjectionMatrix();

			}


			// 拾取对象
			function pickupObjects(event) {
				// 点击屏幕创建一个向量
				var raycaster = new THREE.Raycaster();
				var vector = new THREE.Vector2((event.clientX / window.innerWidth) * 2 - 1, -(event.clientY / window
					.innerHeight) * 2 + 1);
				var fxl = new THREE.Vector3(0, 1, 0);
				var groundplane = new THREE.Plane(fxl, 0);
				raycaster.setFromCamera(vector, camera);
				var ray = raycaster.ray;
				// let intersects = ray.intersectObject(groundplane);
				// console.log(ray)
			}
			document.addEventListener('click', pickupObjects, false); //监听单击拾取对象初始化球体

			function haibaoFun(e) {
				let id = e.target.parentElement.id;
				if (id == "shipin") {
					document.getElementsByClassName("lti_shipin")[0].style.display = "flex";
				}
				if (id == "haibao") {
					document.getElementsByClassName("lti_haibao")[0].style.display = "flex";
				}
			}


			$(document).keydown(function(event) {
				if (event.keyCode == 27) {
					document.getElementsByClassName("lti_haibao")[0].style.display = "none";
					document.getElementsByClassName("lti_shipin")[0].style.display = "none";
				}
			});

			function animate() {

				requestAnimationFrame(animate);
				update();

			}

			function update() {
				if (isUserInteracting === false) {

					lon += 0;

				}

				lat = Math.max(-85, Math.min(85, lat));
				phi = THREE.MathUtils.degToRad(90 - lat);
				theta = THREE.MathUtils.degToRad(lon);

				const x = 500 * Math.sin(phi) * Math.cos(theta);
				const y = 500 * Math.cos(phi);
				const z = 500 * Math.sin(phi) * Math.sin(theta);

				camera.lookAt(x, y, z);

				renderer.render(scene, camera);
				renderer2.render(scene, camera);

			}
		</script>
	</body>
</html>
