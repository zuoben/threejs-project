<!DOCTYPE html>
<html lang="en">
	<head>
		<title>舒迈科技——VR眼镜适配</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<style>
			body {
				margin: 0;
				overflow: hidden;
			}

			.status {
				width: 30px;
				height: 30px;
				position: relative;
				cursor: pointer;
			}

			.solid {
				width: 100%;
				height: 100%;
				position: absolute;
				z-index: 999;
				left: 0;
				top: 0;
				background: #fff;
				border-radius: 100%;
			}

			.status .animate1,
			.status .animate2 {
				background: #fff;
				width: 30px;
				height: 30px;
				border-radius: 100%;
				position: absolute;
				left: 0;
				top: 0;
				z-index: 1;
			}

			@keyframes circle {
				0% {
					-webkit-transform: scale(1);
					transform: scale(1);
					opacity: 1;
				}

				100% {
					-webkit-transform: scale(1.8);
					transform: scale(1.8);
					opacity: 0.1;
				}
			}

			.status .animate1 {
				-webkit-animation: circle 2s 0s ease-out infinite running;
				animation: circle 2s 0s ease-out infinite running;
			}

			.status .animate2 {
				-webkit-animation: circle 2s 1s ease-out infinite running;
				animation: circle 2s 1s ease-out infinite running;
			}

			.element_title {
				width: 25px;
				padding: 15px 5px !important;
				background: rgba(43, 53, 78, .2);
				border-top: 2px solid #d39f51;
				border-bottom: 2px solid #d39f51;
				border-left: 1px solid rgba(213, 170, 104, .5);
				border-right: 1px solid rgba(213, 170, 104, .5);
				-webkit-box-shadow: 4px 3px 17px rgb(8 17 39 / 30%);
				box-shadow: 4px 3px 17px rgb(8 17 39 / 30%);
			}

			.title {
				font-size: 25px;
				color: #fff;
				letter-spacing: 3.6px;
				line-height: 30px;
				layout-flow: vertical-ideographic;
				text-align: center;
				font-family: HYQuanTangShiJ;
				cursor: pointer;
			}

			.title:hover {
				color: #fad194;
			}

			.lt_item {
				position: absolute;
				display: flex;
				align-content: center;
				justify-content: center;
				width: 100%;
				height: 100%;
			}

			.lti_layer {
				width: 100%;
				height: 100%;
				display: flex;
				justify-content: center;
				align-items: center;
				background-color: #00000085;
				display: none;
				z-index: 3;
			}

			.lti_haibao img {
				width: 18%;
			}

			.lti_shipin video {
				width: 50%;
			}
		</style>
	</head>
	<body>
		<div class="lt_item">
			<div class="lti_haibao lti_layer">
				<img src="assets/bgImage/shumai/haibao.jpg">
			</div>
			<div class="lti_shipin lti_layer">
				<video src="three-home-master/threejs-3d-home-main/example-mp4/pc.mp4" autoplay muted preload
					controls="controls" webkit-playsinline="webkit-playsinline"></video>
			</div>
		</div>
		<div id="container"></div>
		<script src="libs/jquery-1.11.2.min.js"></script>
		<script type="importmap">
			{
				"imports": {
					"three": "./libs/jsm/three.module.js"
				}
			}
		</script>

		<script type="module">
			import * as THREE from 'three';

			import { VRButton } from './libs/jsm/webxr/VRButton.js';

			var camera;
			var renderer, scene;

			let isUserInteracting = false,
				onPointerDownMouseX = 0,
				onPointerDownMouseY = 0,
				lon = 0,
				onPointerDownLon = 0,
				lat = 0,
				onPointerDownLat = 0,
				phi = 0,
				theta = 0;

			init();
			animate();

			function init() {
//location.href = "https://static-ca6a394f-62af-45cd-8d00-422c037417b3.bspapp.com/case-056.html"
				const container = document.getElementById('container');

				camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1100);

				scene = new THREE.Scene();

				const geometry = new THREE.SphereGeometry(500, 60, 40);
				// invert the geometry on the x-axis so that all of the faces point inward
				geometry.scale(-1, 1, 1);

				const texture = new THREE.TextureLoader().load('assets/bgImage/shumai/000.jpg');
				const material = new THREE.MeshBasicMaterial({
					map: texture
				});

				// 基础光源，并应用到场景
				scene.add(new THREE.AmbientLight("#ffffff", 1.5));

				const mesh = new THREE.Mesh(geometry, material);
				scene.add(mesh);

				renderer = new THREE.WebGLRenderer();
				renderer.xr.enabled = true;
				renderer.xr.setReferenceSpaceType( 'local' );
				renderer.setPixelRatio(window.devicePixelRatio);
				renderer.setSize(window.innerWidth, window.innerHeight);
				container.appendChild(renderer.domElement);

				document.body.appendChild( VRButton.createButton( renderer ) );
			}

			function animate() {

				renderer.setAnimationLoop( render );

			}

			function render() {

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
