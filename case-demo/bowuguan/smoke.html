<!DOCTYPE html>
<html lang="en">
	<head>
		<title>烟雾，管道烟雾</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" href="css/main.css">
	</head>
	<body>
		<script type="module">
			import * as THREE from './js/three.module.js';

			import {
				OrbitControls
			} from './js/OrbitControls.js';

			import Stats from './js/stats.module.js';
			
			import {
				GUI
			} from './js/dat.gui.module.js';

			import {
				Fire
			} from './js/Fire.js';

			import {
				TWEEN
			} from './js/tween.module.min.js';

			var camera, scene, renderer, stats, controls, grid;

			init();
			animate();
			

			function init() {

				var width = window.innerWidth;
				var height = window.innerHeight;

				camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 1000000);
				camera.position.set(0, 700, 1800);

				scene = new THREE.Scene();
				scene.background = new THREE.Color(0xffffff);

				grid = new THREE.GridHelper(5000, 50, '#B6B6B6', '#B6B6B6');
				grid.material.opacity = 0.2;
				grid.material.depthWrite = false;
				grid.material.transparent = true;
				scene.add(grid);

				var ambientLight = new THREE.AmbientLight(0xcccccc);
				scene.add(ambientLight);

				renderer = new THREE.WebGLRenderer({
					antialias: true,
					alpha: true
				});
				renderer.setPixelRatio(window.devicePixelRatio);
				renderer.setSize(window.innerWidth, window.innerHeight);
				renderer.outputEncoding = THREE.sRGBEncoding;
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 0.85;
				document.body.appendChild(renderer.domElement);

				controls = new OrbitControls(camera, renderer.domElement);

				stats = new Stats();
				document.body.appendChild(stats.dom);

				window.addEventListener('resize', onWindowResize, false);

				// 直管道
				const cylinder = initCylinder()

				// Curve曲线
				const points = new THREE.CatmullRomCurve3([
					new THREE.Vector3(-1050, 100, 500),
					new THREE.Vector3(0, 100, 500),
					new THREE.Vector3(0, 500, 500),
					new THREE.Vector3(500, 500, 500),
					new THREE.Vector3(500, 100, 500),
					new THREE.Vector3(1050, 100, 500)
				])
				// 弯管道
				const tube = initCube(points)

				// 向场景添加模型
				scene.add(cylinder)
				scene.add(tube)


				// 创建粒子对象，用于克隆
				const sprite = initSmokeSprite()

				new TWEEN.Tween({
						v: 0
					})
					.to({
						v: 1
					}, 10)
					.easing(TWEEN.Easing.Linear.None)
					.repeat(Infinity)
					.onUpdate(function(t) {
						if (t.v === 1) {
							const smoke1 = getSmokeGroup(sprite, 60)
							scene.add(smoke1)
							smoke1.position.set(-1000, 100, 0)
							animation1(smoke1)

							const smoke2 = getSmokeGroup(sprite, 60)
							scene.add(smoke2)
							animation2(smoke2, points)
						}

					})
					.start();
			}

			/**
			 * 初始化圆柱体，用于直管道
			 * @return {Mesh}
			 */
			function initCylinder() {
				const cylinderGeometry = new THREE.CylinderGeometry(100, 100, 2100, 100, 100)
				const cylinderMaterial = new THREE.MeshPhongMaterial({
					color: '#474747',
					transparent: true,
					opacity: 0.2,
					side: 1
				})
				const cylinder = new THREE.Mesh(cylinderGeometry, cylinderMaterial)
				cylinder.position.y = 100
				cylinder.rotation.z = Math.PI / 2

				return cylinder

			}

			/**
			 * 初始化管道，用于弯曲管道
			 * @param points Curve曲线
			 * @return {Mesh}
			 */
			function initCube(points) {
				// 管道几何体
				const tubeGeometry = new THREE.TubeGeometry(points, 100, 100, 100, false)

				// 管道材质
				const tubeMaterial = new THREE.MeshPhongMaterial({
					color: new THREE.Color('#474747'),
					transparent: true,
					opacity: 0.2,
					side: 1
				})

				const tube = new THREE.Mesh(tubeGeometry, tubeMaterial)

				tube.geometry.computeBoundingBox()

				const center = new THREE.Vector3()
				tube.geometry.boundingBox.getCenter(center)
				// 中心锚点
				tube.geometry.center()
				// 重新按照中心点设置坐标
				tube.position.set(center.x, center.y, center.z)

				return tube
			}

			/**
			 * 初始化烟雾精灵
			 * 场景中所有的精灵都与此进行克隆，减少内存消耗
			 * @return {Sprite}
			 */
			function initSmokeSprite() {
				// 加载烟雾贴图
				const map = new THREE.TextureLoader().load('img/smoke.png')
				// 创建精灵材质
				const material = new THREE.SpriteMaterial({
					map: map,
					transparent: true,
					opacity: 0.1
				})
				// 创建精灵对象
				return new THREE.Sprite(material)
			}

			/**
			 * 直管烟雾动画
			 * @param group
			 * @returns {*}
			 */
			function animation1(group) {
				var tween = new TWEEN.Tween({
						x: -1000
					})
					.to({
						x: 1000
					}, 10000)
					.easing(TWEEN.Easing.Linear.None)
					.onUpdate(function(t) {
						group.position.x = t.x
					})
					.onComplete(function() {
						TWEEN.remove(tween)
						scene.remove(group)
					})
					.onStart(function() {
						group.visible = true
					})
					.start();
			}

			/**
			 * 弯管烟雾动画
			 * @param group
			 * @param curve
			 * @returns {*}
			 */
			function animation2(group, curve) {
				var tween = new TWEEN.Tween({
						v: 0
					})
					.to({
						v: 1
					}, 10000)
					.easing(TWEEN.Easing.Linear.None)
					.onUpdate(function(t) {
						const point = new THREE.Vector3()
						curve.getPointAt(t.v, point)
						group.position.copy(point)
					})
					.onComplete(function() {
						TWEEN.remove(tween)
						scene.remove(group)
					})
					.onStart(function() {
						group.visible = true
					})
					.start();
			}

			/**
			 * 生成烟雾组
			 * @param s 精灵对象
			 * @param o 圆心
			 * @param r 半径
			 * @returns {Group}
			 */
			function getSmokeGroup(s, r) {
				const group = new THREE.Group()
				for (let i = 0; i < 5; i++) {
					const sprite = s.clone()
					const p = randomVector3ByRadius(r)
					sprite.position.copy(p)
					const sc = r / (5 * 10)
					sprite.scale.set(100 * sc, 100 * sc, 100 * sc)
					group.add(sprite)
				}
				group.renderOrder = 1
				group.visible = false
				return group
			}

			/**
			 * 根据半径和圆心，在圆内随机生成三维坐标
			 * 在一个圆内生成三维坐标公式：y = r * cos(a)，z = r * sin（a）,其中r是随机半径（r<=R），a是随机角度
			 * @param r 半径越大，烟雾越粗
			 * @param o 圆心
			 * @return {Vector3}
			 */
			function randomVector3ByRadius(r) {
				const a = random(-360, 360)
				const radius = random(0, r)
				const y = radius * Math.cos(a)
				const z = radius * Math.sin(a)

				return new THREE.Vector3(0, y, z)
			}

			function random(min, max) {
				return Math.floor(Math.random() * (max - min)) + min;
			}

			function onWindowResize() {

				var width = window.innerWidth;
				var height = window.innerHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize(window.innerWidth, window.innerHeight);

			}

			function animate() {
				TWEEN.update();

				requestAnimationFrame(animate);
				controls.update();

				renderer.clear();
				renderer.render(scene, camera);
				stats.update();

			}
		</script>

	</body>
</html>
