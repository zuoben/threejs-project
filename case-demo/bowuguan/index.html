<!DOCTYPE html>
<html lang="en">
	<head>
		<title>综合效果</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" href="css/main.css">
	</head>
	<body>
		<script type="module">
			import * as THREE from './js/three.module.js';

			import {
				OrbitControls
			} from './js/OrbitControls.js';

			import Stats from './js/stats.module.js';

			import {
				GUI
			} from './js/dat.gui.module.js';

			import {
				Fire
			} from './js/Fire.js';

			import {
				TWEEN
			} from './js/tween.module.min.js';

			import {
				GLTFLoader
			} from './js/GLTFLoader.js';

			var camera, scene, renderer, stats, controls, grid;
			//初始化一个空容器，装载粒子
			var krq = new THREE.Object3D();
			var vertices = [];
			var curveGeometry, divisions, pieces;
			var colorIndex = 0; // 高亮颜色流动的索引值
			var timestamp = 0; // 时间戳

			init();
			animate();


			function init() {

				var width = window.innerWidth;
				var height = window.innerHeight;

				camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 1000000);
				camera.position.set(0, 1500, 2200);

				scene = new THREE.Scene();
				scene.background = new THREE.Color("#1d1d1d");

				grid = new THREE.GridHelper(5000, 50, '#ffffff', '#ffffff');
				// grid.material.opacity = 0.2;
				grid.material.depthWrite = false;
				grid.material.transparent = true;
				// scene.add(grid);

				var ambientLight = new THREE.AmbientLight(0xffffff);
				scene.add(ambientLight);

				renderer = new THREE.WebGLRenderer({
					antialias: true,
					alpha: true
				});
				renderer.setPixelRatio(window.devicePixelRatio);
				renderer.setSize(window.innerWidth, window.innerHeight);
				renderer.outputEncoding = THREE.sRGBEncoding;
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 0.85;
				document.body.appendChild(renderer.domElement);

				controls = new OrbitControls(camera, renderer.domElement);

				stats = new Stats();
				document.body.appendChild(stats.dom);

				window.addEventListener('resize', onWindowResize, false);


				const geometry = new THREE.BoxGeometry(100, 100, 100);
				const material = new THREE.MeshBasicMaterial({
					color: "#ffffff",
				});
				const cube = new THREE.Mesh(geometry, material);
				scene.add(cube);

				// Curve曲线
				const points = new THREE.CatmullRomCurve3([
					new THREE.Vector3(0, 110, 0),
					new THREE.Vector3(0, 600, 0),
					new THREE.Vector3(-150, 600, 0),
					new THREE.Vector3(-320, 500, 0),
					new THREE.Vector3(-300, 200, 0),
				])
				// 弯管道
				const tube = initCube(points)
				scene.add(tube)
				
				initSmoke(points);

				initFlame();
				
				const linePoints = new THREE.CatmullRomCurve3([
					new THREE.Vector3(50, 50, 50),
					new THREE.Vector3(-50, 50, 50),
					new THREE.Vector3(-50, -50, 50)
				])
				divisions = 20; // 曲线的分段数量
				pieces = linePoints.getPoints(divisions); // 返回 分段数量 + 1 个点，例如这里的points.length就为31
				curveGeometry = new THREE.Geometry();
				curveGeometry.vertices = pieces;
				// 设置顶点 colors 数组，与顶点数量和顺序保持一致。
				curveGeometry.colors = new Array(pieces.length).fill(
					new THREE.Color('#000000')
				);
				// 生成材质
				const curveMaterial = new THREE.LineBasicMaterial({
					vertexColors: THREE.VertexColors, // 顶点着色
					transparent: true, // 定义此材质是否透明
					side: THREE.DoubleSide,
				});
				const mesh = new THREE.Line(curveGeometry, curveMaterial);
				scene.add(mesh);
			}

			function initSmoke(points) {
				new TWEEN.Tween({
						v: 0
					})
					.to({
						v: 1
					}, 100)
					.easing(TWEEN.Easing.Linear.None)
					.repeat(Infinity)
					.onUpdate(function(t) {
						if (t.v === 1) {
							// 创建粒子对象，用于克隆
							const sprite = initSmokeSprite()
							const smoke = getSmokeGroup(sprite, 30)
							scene.add(smoke)
							animation2(smoke, points)
						}

					})
					.start();
			}

			// 添加火焰
			function initFlame() {
				var texture = new THREE.TextureLoader().load("./img/flamex.png");
				//sprite材质
				var material = new THREE.SpriteMaterial({
					//以canvas作为纹理
					map: texture,
					color: "#ffac05",
					//混合度 加法混合
					blending: THREE.AdditiveBlending
				});

				//循环1000  添加粒子
				for (var i = 0; i < 2000; i++) {
					var particle = new THREE.Sprite(material);
					initParticle(particle, i);
					krq.add(particle);
					krq.name = "particles_flame";
				}
				krq.position.set(0, 50, 0);
				scene.add(krq);
			}

			/**
			 * 粒子 延迟发散
			 * @param particle
			 * @param delay
			 */
			function initParticle(particle, delay) {
				particle.position.set(0, Math.random() + 12, 0);
				particle.scale.x = particle.scale.y = Math.random() * 33;
				//下面是一系列的动画
				var xx = Math.random() * 40 - 20;
				var yy = Math.cos((Math.PI / 100) * xx) * 80;
				//位移
				new TWEEN.Tween(particle.position)
					.delay(delay)
					.to({
						x: xx,
						y: yy,
						z: Math.random() * 40 - 20
					}, 2000)
					.onComplete(function() {
						initParticle(particle, delay);
					})
					.start();
				// 大小
				new TWEEN.Tween(particle.scale)
					.delay(delay)
					.to({
						x: 0.01,
						y: 0.01
					}, 1000)
					.start();
			}

			/**
			 * 初始化圆柱体，用于直管道
			 * @return {Mesh}
			 */
			function initCylinder() {
				const cylinderGeometry = new THREE.CylinderGeometry(100, 100, 2100, 100, 100)
				const cylinderMaterial = new THREE.MeshPhongMaterial({
					color: '#474747',
					transparent: true,
					opacity: 0.2,
					side: 1
				})
				const cylinder = new THREE.Mesh(cylinderGeometry, cylinderMaterial)
				cylinder.position.y = 100
				cylinder.rotation.z = Math.PI / 2

				return cylinder

			}

			/**
			 * 初始化管道，用于弯曲管道
			 * @param points Curve曲线
			 * @return {Mesh}
			 */
			function initCube(points) {
				// 管道几何体
				const tubeGeometry = new THREE.TubeGeometry(points, 50, 50, 50, false)

				// 管道材质
				const tubeMaterial = new THREE.MeshPhongMaterial({
					color: new THREE.Color('#ffffff'),
					transparent: true,
					opacity: 0.4,
					side: 1
				})

				const tube = new THREE.Mesh(tubeGeometry, tubeMaterial)

				tube.geometry.computeBoundingBox()

				const center = new THREE.Vector3()
				tube.geometry.boundingBox.getCenter(center)
				// 中心锚点
				tube.geometry.center()
				// 重新按照中心点设置坐标
				tube.position.set(center.x, center.y, center.z)

				return tube
			}

			/**
			 * 初始化烟雾精灵
			 * 场景中所有的精灵都与此进行克隆，减少内存消耗
			 * @return {Sprite}
			 */
			function initSmokeSprite() {
				// 加载烟雾贴图
				const map = new THREE.TextureLoader().load('img/smoke.png')
				// 创建精灵材质
				const material = new THREE.SpriteMaterial({
					map: map,
					transparent: true,
					opacity: 0.3
				})
				// 创建精灵对象
				return new THREE.Sprite(material)
			}

			/**
			 * 直管烟雾动画
			 * @param group
			 * @returns {*}
			 */
			function animation1(group) {
				var tween = new TWEEN.Tween({
						x: -1000
					})
					.to({
						x: 1000
					}, 10000)
					.easing(TWEEN.Easing.Linear.None)
					.onUpdate(function(t) {
						group.position.x = t.x
					})
					.onComplete(function() {
						TWEEN.remove(tween)
						scene.remove(group)
					})
					.onStart(function() {
						group.visible = true
					})
					.start();
			}

			/**
			 * 弯管烟雾动画
			 * @param group
			 * @param curve
			 * @returns {*}
			 */
			function animation2(group, curve) {
				var tween = new TWEEN.Tween({
						v: 0
					})
					.to({
						v: 1
					}, 10000)
					.easing(TWEEN.Easing.Linear.None)
					.onUpdate(function(t) {
						const point = new THREE.Vector3()
						curve.getPointAt(t.v, point)
						group.position.copy(point)
					})
					.onComplete(function() {
						TWEEN.remove(tween)
						scene.remove(group)
					})
					.onStart(function() {
						group.visible = true
					})
					.start();
			}

			/**
			 * 生成烟雾组
			 * @param s 精灵对象
			 * @param o 圆心
			 * @param r 半径
			 * @returns {Group}
			 */
			function getSmokeGroup(s, r) {
				const group = new THREE.Group()
				for (let i = 0; i < 5; i++) {
					const sprite = s.clone()
					const p = randomVector3ByRadius(r)
					sprite.position.copy(p)
					const sc = r / (5 * 10)
					sprite.scale.set(100 * sc, 100 * sc, 100 * sc)
					group.add(sprite)
				}
				group.renderOrder = 1
				group.visible = false
				return group
			}

			/**
			 * 根据半径和圆心，在圆内随机生成三维坐标
			 * 在一个圆内生成三维坐标公式：y = r * cos(a)，z = r * sin（a）,其中r是随机半径（r<=R），a是随机角度
			 * @param r 半径越大，烟雾越粗
			 * @param o 圆心
			 * @return {Vector3}
			 */
			function randomVector3ByRadius(r) {
				const a = random(-360, 360)
				const radius = random(0, r)
				const y = radius * Math.cos(a)
				const z = radius * Math.sin(a)

				return new THREE.Vector3(0, y, z)
			}

			function random(min, max) {
				return Math.floor(Math.random() * (max - min)) + min;
			}

			function onWindowResize() {

				var width = window.innerWidth;
				var height = window.innerHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize(window.innerWidth, window.innerHeight);

			}

			function animate() {
				TWEEN.update();
				
				let now = new Date().getTime();
				if (now - timestamp > 100) {
					curveGeometry.colors = new Array(divisions + 1)
						.fill(new THREE.Color('#000000'))
						.map((color, index) => {
							if (index === colorIndex) {
								return new THREE.Color('#ffff00');
							}
							return color;
						});
					// 如果curveGeometry.colors数据发生变化，colorsNeedUpdate值需要被设置为true
					curveGeometry.colorsNeedUpdate = true;
					timestamp = now;
					colorIndex++;
					if (colorIndex > divisions) {
						colorIndex = 0;
					}
				}

				requestAnimationFrame(animate);
				controls.update();

				renderer.render(scene, camera);
				stats.update();

			}
		</script>

	</body>
</html>
