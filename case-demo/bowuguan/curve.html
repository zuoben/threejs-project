<!DOCTYPE html>
<html lang="en">
	<head>
		<title>流线，流光</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" href="css/main.css">
	</head>
	<body>
		<script type="module">
			import * as THREE from './js/three.module.js';

			import {
				OrbitControls
			} from './js/OrbitControls.js';

			import Stats from './js/stats.module.js';

			import {
				GUI
			} from './js/dat.gui.module.js';

			import {
				Fire
			} from './js/Fire.js';

			import {
				TWEEN
			} from './js/tween.module.min.js';

			var camera, scene, renderer, stats, controls, grid;

			var colorIndex = 0; // 高亮颜色流动的索引值
			var timestamp = 0; // 时间戳
			var geometry, divisions, points;

			init();
			animate();


			function init() {

				var width = window.innerWidth;
				var height = window.innerHeight;

				camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 1000000);
				camera.position.set(0, 100, 100);

				scene = new THREE.Scene();
				scene.background = new THREE.Color(0x000000);

				grid = new THREE.GridHelper(5000, 50, '#B6B6B6', '#B6B6B6');
				grid.material.opacity = 0.2;
				grid.material.depthWrite = false;
				grid.material.transparent = true;
				scene.add(grid);

				var ambientLight = new THREE.AmbientLight(0xcccccc);
				scene.add(ambientLight);

				renderer = new THREE.WebGLRenderer({
					antialias: true,
					alpha: true
				});
				renderer.setPixelRatio(window.devicePixelRatio);
				renderer.setSize(window.innerWidth, window.innerHeight);
				renderer.outputEncoding = THREE.sRGBEncoding;
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 0.85;
				document.body.appendChild(renderer.domElement);

				controls = new OrbitControls(camera, renderer.domElement);

				stats = new Stats();
				document.body.appendChild(stats.dom);

				window.addEventListener('resize', onWindowResize, false);

				const point1 = [50, 0, 0]; // 点1坐标
				const point2 = [-50, 0, 0]; // 点2坐标
				const controlPoint = [0, 50, 0]; // 控制点坐标

				// 创建三维二次贝塞尔曲线
				const curve = new THREE.QuadraticBezierCurve3(
					new THREE.Vector3(point1[0], point1[1], point1[2]),
					new THREE.Vector3(controlPoint[0], controlPoint[1], controlPoint[2]),
					new THREE.Vector3(point2[0], point2[1], point2[2])
				);
				divisions = 30; // 曲线的分段数量
				points = curve.getPoints(divisions); // 返回 分段数量 + 1 个点，例如这里的points.length就为31
				geometry = new THREE.Geometry();
				geometry.vertices = points;
				// 设置顶点 colors 数组，与顶点数量和顺序保持一致。
				geometry.colors = new Array(points.length).fill(
					new THREE.Color('#333300')
				);
				// 生成材质
				const material = new THREE.LineBasicMaterial({
					vertexColors: THREE.VertexColors, // 顶点着色
					// transparent: true, // 定义此材质是否透明
					side: THREE.DoubleSide,
				});
				const mesh = new THREE.Line(geometry, material);
				scene.add(mesh);
			}

			function onWindowResize() {

				var width = window.innerWidth;
				var height = window.innerHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize(window.innerWidth, window.innerHeight);

			}
			function animate() {
				// TWEEN.update();

				controls.update();
				let now = new Date().getTime();
				if (now - timestamp > 50) {
					geometry.colors = new Array(divisions + 1)
						.fill(new THREE.Color('#333300'))
						.map((color, index) => {
							if (index === colorIndex) {
								return new THREE.Color('#ffff00');
							}
							return color;
						});
					// 如果geometry.colors数据发生变化，colorsNeedUpdate值需要被设置为true
					geometry.colorsNeedUpdate = true;
					timestamp = now;
					colorIndex++;
					if (colorIndex > divisions) {
						colorIndex = 0;
					}
				}
				renderer.render(scene, camera);
				stats.update();
				requestAnimationFrame(animate);

			}
		</script>

	</body>
</html>
