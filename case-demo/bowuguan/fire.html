<!DOCTYPE html>
<html lang="en">
	<head>
		<title>烟雾</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" href="css/main.css">
	</head>
	<body>
		<script type="module">
			import * as THREE from './js/three.module.js';

			import {
				OrbitControls
			} from './js/OrbitControls.js';

			import Stats from './js/stats.module.js';

			import {
				GUI
			} from './js/dat.gui.module.js';

			import {
				Fire
			} from './js/Fire.js';

			import {
				TWEEN
			} from './js/tween.module.min.js';

			import {
				GLTFLoader
			} from './js/GLTFLoader.js';

			var camera, scene, renderer, stats, controls, grid;
			//初始化一个空容器，装载粒子
			var krq = new THREE.Object3D();
			var vertices = [];

			init();
			animate();


			function init() {

				var width = window.innerWidth;
				var height = window.innerHeight;

				camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 1000000);
				camera.position.set(700, 400, 700);

				scene = new THREE.Scene();
				scene.background = new THREE.Color(0x000000);

				grid = new THREE.GridHelper(5000, 50, '#ffffff', '#ffffff');
				// grid.material.opacity = 0.2;
				grid.material.depthWrite = false;
				grid.material.transparent = true;
				// scene.add(grid);

				var ambientLight = new THREE.AmbientLight(0xcccccc);
				scene.add(ambientLight);

				renderer = new THREE.WebGLRenderer({
					antialias: true,
					alpha: true
				});
				renderer.setPixelRatio(window.devicePixelRatio);
				renderer.setSize(window.innerWidth, window.innerHeight);
				renderer.outputEncoding = THREE.sRGBEncoding;
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 0.85;
				document.body.appendChild(renderer.domElement);

				controls = new OrbitControls(camera, renderer.domElement);

				stats = new Stats();
				document.body.appendChild(stats.dom);

				window.addEventListener('resize', onWindowResize, false);
				
				initFlame();
			}

			// 添加火焰
			function initFlame() {
				var texture = new THREE.TextureLoader().load("./img/flamex.png");
				//sprite材质
				var material = new THREE.SpriteMaterial({
					//以canvas作为纹理
					map: texture,
					color: "#ffac05",
					//混合度 加法混合
					blending: THREE.AdditiveBlending
				});

				//循环1000  添加粒子
				for (var i = 0; i < 2000; i++) {
					var particle = new THREE.Sprite(material);
					initParticle(particle, i);
					krq.add(particle);
					krq.name = "particles_flame";
				}
				krq.position.set(30, 100, 30);
				scene.add(krq);
			}

			/**
			 * 粒子 延迟发散
			 * @param particle
			 * @param delay
			 */
			function initParticle(particle, delay) {
				particle.position.set(0, Math.random() + 12, 0);
				particle.scale.x = particle.scale.y = Math.random() * 33;
				//下面是一系列的动画
				var xx = Math.random() * 40 - 20;
				var yy = Math.cos((Math.PI / 100) * xx) * 80;
				//位移
				new TWEEN.Tween(particle.position)
					.delay(delay)
					.to({
						x: xx,
						y: yy,
						z: Math.random() * 40 - 20
					}, 2000)
					.onComplete(function() {
						initParticle(particle, delay);
					})
					.start();
				// 大小
				new TWEEN.Tween(particle.scale)
					.delay(delay)
					.to({
						x: 0.01,
						y: 0.01
					}, 1000)
					.start();
			}

			function onWindowResize() {

				var width = window.innerWidth;
				var height = window.innerHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize(window.innerWidth, window.innerHeight);

			}

			function animate() {
				TWEEN.update();

				requestAnimationFrame(animate);
				controls.update();

				renderer.render(scene, camera);
				stats.update();

			}
		</script>

	</body>
</html>
