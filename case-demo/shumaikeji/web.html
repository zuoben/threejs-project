<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webvr - panorama</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
		<link rel="stylesheet" href="css/main.css">
	</head>
	<body>
		<div id="container"></div>
		<script src="js/three.min.js"></script>
		<script src="js/panolens.min.js"></script>
		<script src="js/vr/WebVR.js"></script>

		<script>

		var camera;
		var renderer;
		var scene;
		var viewer;
		var container;

		init();
		animate();

		function init() {
			container = document.querySelector('#container');
			renderer = new THREE.WebGLRenderer();
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			// renderer.vr.enabled = true;
			container.appendChild( renderer.domElement );

			// container.appendChild( WEBVR.createButton( renderer, { referenceSpaceType: 'local' } ) );
			// document.body.appendChild( VRButton.createButton( renderer ) );

			scene = new THREE.Scene();

			camera = new THREE.PerspectiveCamera( 90, window.innerWidth / window.innerHeight, 1, 1000 );
			camera.layers.enable( 1 );

			var geometry = new THREE.BoxBufferGeometry( 100, 100, 100 );
			geometry.scale( 1, 1, - 1 );
			var textures = getTexturesFromAtlasFile( "img/ttt.jpg", 12 );

			var materials = [];

			for ( var i = 0; i < 6; i ++ ) {

				materials.push( new THREE.MeshBasicMaterial( { map: textures[ i ] } ) );

			}

			var skyBox = new THREE.Mesh( geometry, materials );
			skyBox.layers.set( 1 );
			// scene.add( skyBox );


			var materialsR = [];

			for ( var i = 6; i < 12; i ++ ) {

				materialsR.push( new THREE.MeshBasicMaterial( { map: textures[ i ] } ) );

			}

			var skyBoxR = new THREE.Mesh( geometry, materialsR );
			skyBoxR.layers.set( 2 );
			// scene.add( skyBoxR );
			
			var panorama1 = new PANOLENS.ImagePanorama('img/000.jpg');
			// 创建全景查看器 
			viewer = new PANOLENS.Viewer({
				container: container,
				controlBar: false,
				output: 'console',
				renderer: renderer,
				// enableReticle: true,
				// camera: camera,
				// scene: scene,
			});
			
			viewer.add(panorama1);

			window.addEventListener( 'resize', onWindowResize, false );

		}

		function getTexturesFromAtlasFile( atlasImgUrl, tilesNum ) {

			var textures = [];

			for ( var i = 0; i < tilesNum; i ++ ) {

				textures[ i ] = new THREE.Texture();

			}

			var loader = new THREE.ImageLoader();
			loader.load( atlasImgUrl, function ( imageObj ) {

				var canvas, context;
				var tileWidth = imageObj.height;

				for ( var i = 0; i < textures.length; i ++ ) {

					canvas = document.createElement( 'canvas' );
					context = canvas.getContext( '2d' );
					canvas.height = tileWidth;
					canvas.width = tileWidth;
					context.drawImage( imageObj, tileWidth * i, 0, tileWidth, tileWidth, 0, 0, tileWidth, tileWidth );
					textures[ i ].image = canvas;
					textures[ i ].needsUpdate = true;

				}

			} );

			return textures;

		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize( window.innerWidth, window.innerHeight );

		}

		function animate() {

			renderer.setAnimationLoop( render );

		}

		function render() {

			renderer.render( scene, camera );

		}

		</script>
	</body>
</html>
