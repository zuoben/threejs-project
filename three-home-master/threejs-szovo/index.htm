		<script>
		$(function(){
			var panos = [{
				url: './img/1.jpg',
				desc: '全景主页',
				target: {
					longitude: 3.848,
					latitude: -0.244
				}
			}, {
				url: './img/2.jpg',
				desc: '全景详情',
				target: {
					longitude: 0,
					latitude: 0
				}
			}];
			var isCahe = true;
			var PSV = new PhotoSphereViewer({
				container: 'photosphere',
				panorama: panos[0].url,
				caption: panos[0].desc,
				time_anim: false,
				default_long: Math.PI / 2,
				loading_img: '',
				loading_txt: '',
				cache_texture:10,
				navbar: [
					'autorotate', 'zoom', 'markers',
					'spacer-1',
					'caption', 'gyroscope', 'fullscreen'
				],
				anim_speed: "0.6rpm",
				markers: (function() {
					return common();
				}())
			});
			
			PSV.on('ready',function(){
				PSV.toggleAutorotate();
				$('#audios')[0].play();
				$('.szovo').hide();
				$('.playBtn').show();
			});
			
			PSV.on('select-marker', function(marker) {
				console.log(marker);
				if(marker.data && marker.data.deletable) {
					if(isCahe){
						$('.szovo').show();
						isCahe = false;
					}
					
					PSV.clearMarkers();
					PSV.setPanorama(panos[1].url, panos[1].target, true)
						.then(function() {
							$('.szovo').hide();
							PSV.setCaption(panos[1].desc);
							var len = common2().length;
							for(var k = 0; k < len; k++) {
								PSV.addMarker(common2()[k]);
							}
							PSV.setCaption(panos[1].desc);
						});
				}
				if(marker.data && marker.data.deletables) {
					if(isCahe){
						$('.szovo').show();
						isCahe = false;
					}
					PSV.clearMarkers();
					PSV.setPanorama(panos[0].url, panos[0].target, true)
						.then(function() {
							$('.szovo').hide();
							PSV.setCaption(panos[1].desc);
							var len = common().length;
							for(var k = 0; k < len; k++) {
								PSV.addMarker(common()[k]);
							}
							PSV.setCaption(panos[0].desc);
						});
				}
			});

			$('.playBtn').click(function() {
				if($(this).hasClass('pause')) {
					$(this).removeClass('pause')
					$('#audios')[0].play()
				} else {
					$(this).addClass('pause')
					$('#audios')[0].pause()
				}
			});

			function common() {
				var a = [];
				a.push({
					id: '#0',
					tooltip: '另一个房间',
					latitude: -0.4,
					longitude: -1.80,
					image: './img/pin2.png',
					width: 64,
					height: 64,
					anchor: 'bottom center',
					data: {
						deletable: true
					}
				});
				a.push({
					id: 'text',
					longitude: -0.5,
					latitude: -0.28,
					html: '床头柜',
					anchor: 'bottom right',
					style: {
						maxWidth: '320px',
						color: '#fff',
						fontSize: '20px',
						fontFamily: 'Helvetica, sans-serif',
						textAlign: 'center'
					},
					tooltip: {
						content: '这里可以放注释',
						position: 'right'
					}
				});
				a.push({
					id: 'circle',
					tooltip: '这是坐窗的坐垫',
					circle: 20,
					svgStyle: {
						fill: 'rgba(255,255,0,0.3)',
						stroke: 'yellow',
						strokeWidth: '2px'
					},
					//						longitude: 0.14842681258549928,
					//						latitude: -0.8678522571819425,
					x: 8395,
					y: 6827,
					anchor: 'center right'
				});
				return a
			}

			function common2() {
				var a = [];
				a.push({
					id: '#1',
					tooltip: '第一个房间',
					latitude: -0.5,
					longitude: -2.00,
					image: './img/pin2.png',
					width: 64,
					height: 64,
					anchor: 'bottom center',
					data: {
						deletables: true
					}
				});
				a.push({
					id: 'text',
					longitude: -0.5,
					latitude: -0.28,
					html: '挂壁电视',
					anchor: 'bottom right',
					style: {
						maxWidth: '320px',
						color: '#fff',
						fontSize: '20px',
						fontFamily: 'Helvetica, sans-serif',
						textAlign: 'center'
					},
					tooltip: {
						content: '可以休闲看电视',
						position: 'right'
					}
				});
				a.push({
					id: 'circle',
					tooltip: '这是一个床头桌',
					circle: 10,
					svgStyle: {
						fill: 'rgba(255,255,0,0.3)',
						stroke: '#4693e2',
						strokeWidth: '1px'
					},
					longitude: 1.666216355886427,
					latitude:-0.24621449385904493,
											 
					anchor: 'center right'
				});
				return a
			}
			
			function transToThreeCoord(x, y) {
				let mouse = new THREE.Vector3();
				mouse.x = (x / 14620) * 2 - 1;
				mouse.y = -(y / 7310) * 2 + 1;
				return mouse;
			}

			/**
			 * 当用户点击某个地方时，创建一个新的标记，获取经纬度
			 */

				// PSV.addMarker({

				// 	latitude: e.latitude,

				// 	width: 32,
				// 	height: 32,
				// 	anchor: 'bottom center',
				// 	tooltip: 'Generated pin',
				// 	data: {

				// 	}
				// });
				console.log(e.longitude,e.latitude)
			});
		})
		</script>
