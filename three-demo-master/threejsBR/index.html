<!DOCTYPE html>
<html lang="en">
<head>
    <title>城市星光</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script type=text/javascript src="https://threejs.org/build/three.min.js"></script>
    <style>
        body {
            font-family: Monospace;
            background-color: #000000;
            color: #fff;
            margin: 0;
        }
        canvas {
            display: block;
        }
        a {
            color: #ff4;
        }
    </style>
</head>
<body>

<script type=text/javascript >
//type="module"
    //import * as THREE from 'https://threejs.org/build/three.module.js';

    var camera, scene, renderer;
    var buildingRoofs = [];

    init();
    animate();

    function init() {

        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2( 0x16140d, 0.01 );

        camera = new THREE.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 1, 2000 );
        camera.position.y = 20;
        camera.rotation.x = - 0.4;

        generateFloor();
        generateBuildings();
        generateLights();
        generateAtmosphere();
        generateSky();

        renderer = new THREE.WebGLRenderer( { antialias: true } );
        renderer.setPixelRatio( window.devicePixelRatio );
        renderer.setSize( window.innerWidth, window.innerHeight );
        document.body.appendChild( renderer.domElement );

        //

        window.addEventListener( 'resize', onWindowResize, false );

    }

    //

    function generateFloor() {

        var geometry = new THREE.PlaneBufferGeometry( 2000, 2000 );
        geometry.rotateX( - Math.PI / 2 );

        var material = new THREE.MeshBasicMaterial( { color: 0x000000 } );

        var mesh = new THREE.Mesh( geometry, material );
        mesh.position.y = - 1;
        scene.add( mesh );

    }

    function generateBuildings() {

        var geometry = new THREE.BoxBufferGeometry( 1, 1, 1 );
        geometry.translate( 0, 0.5, 0 );

        var material = new THREE.MeshBasicMaterial( { color: 0x000000 } );

        var mesh = new THREE.InstancedMesh( geometry, material, 10000 );
        mesh.frustumCulled = false;

        var transform = new THREE.Object3D();

        for ( var i = 0; i < 10000; i ++ ) {

            transform.position.x = Math.random() * 1000 - 500;
            transform.position.z = - Math.random() * Math.random() * Math.random() * 1000;
            transform.scale.y = Math.random() * 10 + 1;
            transform.updateMatrix();

            mesh.setMatrixAt( i ++, transform.matrix );

            if ( Math.random() > 0.5 ) {

                buildingRoofs.push(
                    transform.position.x, transform.scale.y, transform.position.z
                );

            }

        }

        mesh.instanceMatrix.needsUpdate = true;

        scene.add( mesh );

    }

    function generateLights() {

        var vertices = [];

        for ( var i = 0; i < 40000; i ++ ) {

            var x = 1000 * Math.random() - 500;
            var z = - Math.random() * Math.random() * Math.random() * 1000;

            vertices.push( x, 0, z );

        }

        for ( var i = 0; i < buildingRoofs.length; i += 3 ) {

            var x = buildingRoofs[ i + 0 ];
            var y = buildingRoofs[ i + 1 ] + 0.5;
            var z = buildingRoofs[ i + 2 ];

            vertices.push( x, y, z );

        }

        var colors = [];
        var colorOptions = [
            [ 0.25, 0.25, 0.25 ], [ 0.5, 0.5, 0.25 ], [ 1, 1, 0.5 ], [ 1, 0.5, 0.5 ], [ 0.5, 1, 1 ]
        ];

        for ( var i = 0; i < vertices.length; i += 3 ) {

            var index = Math.floor( Math.random() * Math.random() * colorOptions.length );
            var color = colorOptions[ index ];
            colors.push( color[ 0 ], color[ 1 ], color[ 2 ] );

        }

        var geometry = new THREE.BufferGeometry();
        geometry.setAttribute( 'position', new THREE.Float32BufferAttribute( vertices, 3 ) );
        geometry.setAttribute( 'color', new THREE.Float32BufferAttribute( colors, 3 ) );

        var sprite = new THREE.CanvasTexture( generateSprite() );

        var material = new THREE.PointsMaterial( {
            color: new THREE.Color( 2, 2, 2 ),
            map: sprite,
            size: 1.5,
            sizeAttenuation: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            fog: false,
            vertexColors: true
        });

        var points = new THREE.Points( geometry, material );
        scene.add( points );

    }

    function generateAtmosphere() {

        var vertices = [];

        for ( var i = 0; i < 1000; i ++ ) {

            var x = 1000 * Math.random() - 500;
            var z = - Math.random() * Math.random() * Math.random() * Math.random() * 500;
            vertices.push( x, 0, z );

        }

        var geometry = new THREE.BufferGeometry();
        geometry.setAttribute( 'position', new THREE.Float32BufferAttribute( vertices, 3 ) );

        var sprite = new THREE.CanvasTexture( generateAtmosphereSprite() );

        var material = new THREE.PointsMaterial( {
            color: 0x182a25,
            map: sprite,
            size: 200,
            sizeAttenuation: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.25,
            fog: false
        });

        var points = new THREE.Points( geometry, material );
        points.position.y = 2;
        scene.add( points );

    }

    function generateSprite() {

        var width = 64, height = 64;

        var canvas = document.createElement( 'canvas' );
        canvas.width = width;
        canvas.height = height;

        var context = canvas.getContext( '2d' );

        var gradient = context.createRadialGradient(
            width / 2, height / 2, 0, width / 2, height / 2, width / 2
        );

        gradient.addColorStop( 0, 'rgba(255,255,255,1)' );
        gradient.addColorStop( 0.1, 'rgba(255,255,255,1)' );
        gradient.addColorStop( 0.2, 'rgba(32,32,32,1)' );
        gradient.addColorStop( 1, 'rgba(0,0,0,1)' );
        context.fillStyle = gradient;
        context.fillRect( 0, 0, width, height );

        return canvas;

    }

    function generateAtmosphereSprite() {

        var width = 64, height = 64;

        var canvas = document.createElement( 'canvas' );
        canvas.width = width;
        canvas.height = height;

        var context = canvas.getContext( '2d' );

        var gradient = context.createRadialGradient(
            width / 2, height / 2, 0, width / 2, height / 2, width / 2
        );

        gradient.addColorStop( 0, 'rgba(255,255,255,1)' );
        gradient.addColorStop( 1, 'rgba(0,0,0,1)' );
        context.fillStyle = gradient;
        context.fillRect( 0, 0, width, height );

        return canvas;

    }

    function generateSky() {

        var geometry = new THREE.IcosahedronBufferGeometry( 1000 );
        var material = new THREE.MeshBasicMaterial( { color: 0x000000, side: THREE.BackSide } );
        var mesh = new THREE.Mesh( geometry, material );
        scene.add( mesh );

    }

    function onWindowResize() {

        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        renderer.setSize( window.innerWidth, window.innerHeight );

    }

    //

    function animate() {

        renderer.setAnimationLoop( render );

    }

    function render() {

        camera.position.z = - performance.now() / 1000;
        renderer.render( scene, camera );

    }

</script>
</body>
</html>
