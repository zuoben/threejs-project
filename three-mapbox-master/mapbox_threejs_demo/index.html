<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Add a 3D model</title>
		<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
		<link href="https://api.mapbox.com/mapbox-gl-js/v2.9.2/mapbox-gl.css" rel="stylesheet">
		<script src="https://api.mapbox.com/mapbox-gl-js/v2.9.2/mapbox-gl.js"></script>
		<style>
			body {
				margin: 0;
				padding: 0;
			}

			#map {
				position: absolute;
				top: 0;
				bottom: 0;
				width: 100%;
			}
		</style>
	</head>
	<body>
		<script src="https://unpkg.com/three@0.126.0/build/three.min.js"></script>
		<script src="https://unpkg.com/three@0.126.0/examples/js/loaders/GLTFLoader.js"></script>
		<div id="map"></div>
		<script>
			// TO MAKE THE MAP APPEAR YOU MUST
			// ADD YOUR ACCESS TOKEN FROM
			// https://account.mapbox.com
			mapboxgl.accessToken = 'pk.eyJ1IjoibWFwYm94IiwiYSI6ImNpejY4M29iazA2Z2gycXA4N2pmbDZmangifQ.-g_vE53SD2WrJ6tFX7QHmA';
			const map = new mapboxgl.Map({
				container: 'map',
				style: 'mapbox://styles/mapbox-map-design/ckhqrf2tz0dt119ny6azh975y',
				// style: 'mapbox://styles/mapbox/satellite-streets-v11',
				// style: 'mapbox://mapbox.mapbox-terrain-dem-v1', // style URL
				// zoom: 18,
				zoom: 1,
				center: [124.808596,44.318896],
				pitch: 60,
				projection: 'globe'
				// antialias: true // create the gl context with MSAA antialiasing, so custom layers are antialiased
			});

			// parameters to ensure the model is georeferenced correctly on the map
			const modelOrigin = [124.808596,44.318896];
			const modelAltitude = 0;
			const modelRotate = [Math.PI / 2, 0, 0];

			const modelAsMercatorCoordinate = mapboxgl.MercatorCoordinate.fromLngLat(
				modelOrigin,
				modelAltitude
			);

			// transformation parameters to position, rotate and scale the 3D model onto the map
			const modelTransform = {
				translateX: modelAsMercatorCoordinate.x,
				translateY: modelAsMercatorCoordinate.y,
				translateZ: modelAsMercatorCoordinate.z,
				rotateX: modelRotate[0],
				rotateY: modelRotate[1],
				rotateZ: modelRotate[2],
				/* Since the 3D model is in real world meters, a scale transform needs to be
				 * applied since the CustomLayerInterface expects units in MercatorCoordinates.
				 */
				scale: modelAsMercatorCoordinate.meterInMercatorCoordinateUnits()
			};

			const THREE = window.THREE;
			const mouse = new THREE.Vector4(-1000, -1000, 1, 1);
			var methArr = [];

			// configuration of the custom layer for a 3D model per the CustomLayerInterface
			const customLayer = {
				id: '3d-model',
				type: 'custom',
				renderingMode: '3d',
				onAdd: function(map, gl) {
					this.camera = new THREE.Camera();
					this.scene = new THREE.Scene();

					// create two three.js lights to illuminate the model
					const directionalLight = new THREE.DirectionalLight(0xffffff);
					directionalLight.position.set(0, -70, 100).normalize();
					this.scene.add(directionalLight);
					
					this.scene.add(new THREE.AmbientLight("#ffffff", 1.5));

					const directionalLight2 = new THREE.DirectionalLight(0xffffff);
					directionalLight2.position.set(0, 70, 100).normalize();
					this.scene.add(directionalLight2);

					// use the three.js GLTF loader to add the 3D model to the three.js scene
					const loader = new THREE.GLTFLoader();
					loader.load(
						'../../assets/models/gongchang/gongchang.glb',
						(gltf) => {
							// this.scene.add(gltf.scene);
							// methArr = gltf.scene;
						}
					);
					this.map = map;

					// use the Mapbox GL JS map canvas for three.js
					this.renderer = new THREE.WebGLRenderer({
						canvas: map.getCanvas(),
						context: gl,
						antialias: true
					});

				this.renderer.setClearColor(new THREE.Color("#0e0934"));
					this.renderer.autoClear = false;
					this.raycaster = new THREE.Raycaster();

					this.renderer.domElement.addEventListener('click', (event) => {
						event.preventDefault();
						mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
						mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
						// 通过摄像机和鼠标位置更新射线
						// this.raycaster.setFromCamera(mouse, this.camera);
						// 计算物体和射线的焦点
						// const intersects = this.raycaster.intersectObjects(methArr.children, true);
						// if (intersects.length > 0) {
						// 	intersects[0].object.material.wireframe = true;
						// }
					})
				},
				render: function(gl, matrix) {
					const rotationX = new THREE.Matrix4().makeRotationAxis(
						new THREE.Vector3(1, 0, 0),
						modelTransform.rotateX
					);
					const rotationY = new THREE.Matrix4().makeRotationAxis(
						new THREE.Vector3(0, 1, 0),
						modelTransform.rotateY
					);
					const rotationZ = new THREE.Matrix4().makeRotationAxis(
						new THREE.Vector3(0, 0, 1),
						modelTransform.rotateZ
					);

					const m = new THREE.Matrix4().fromArray(matrix);
					const l = new THREE.Matrix4()
						.makeTranslation(
							modelTransform.translateX,
							modelTransform.translateY,
							modelTransform.translateZ
						)
						.scale(
							new THREE.Vector3(
								modelTransform.scale,
								-modelTransform.scale,
								modelTransform.scale
							)
						)
						.multiply(rotationX)
						.multiply(rotationY)
						.multiply(rotationZ);

					this.camera.projectionMatrix = m.multiply(l);
					this.renderer.resetState();

					const freeCamera = this.map.getFreeCameraOptions();
					let cameraPosition = new THREE.Vector4(freeCamera.position.x, freeCamera.position.y, freeCamera
						.position.z, 1);
					cameraPosition.applyMatrix4(l.invert());
					let direction = mouse.clone().applyMatrix4(this.camera.projectionMatrix.clone().invert());
					direction.divideScalar(direction.w);
					this.raycaster.set(cameraPosition, direction.sub(cameraPosition).normalize());

					if (methArr.length < 1) return;

					const intersects = this.raycaster.intersectObjects(methArr.children, true);
					console.log('Intersection count:', intersects.length)

					for (let i = 0; i < intersects.length; i++) {
						// intersects[i].object.material.wireframe = true;
					}

					this.renderer.render(this.scene, this.camera);
					// this.map.triggerRepaint();

					for (let i = 0; i < intersects.length; i++) {
						// intersects[i].object.material.wireframe = false;
					}
				}
			};

			map.on('style.load', () => {
				map.addLayer(customLayer, 'waterway-label');

				map.on('mousemove', (event) => {
					mouse.x = (event.point.x / window.innerWidth) * 2 - 1;
					mouse.y = -(event.point.y / window.innerHeight) * 2 + 1;
					map.triggerRepaint();
				});
				
				map.setFog({
				        color: 'rgb(186, 210, 235)', // Lower atmosphere
				        'high-color': 'rgb(36, 92, 223)', // Upper atmosphere
				        'horizon-blend': 0.02, // Atmosphere thickness (default 0.2 at low zooms)
				        'space-color': 'rgb(11, 11, 25)', // Background color
				        'star-intensity': 0.6 // Background star brightness (default 0.35 at low zoooms )
				    });
					
					// fly with default options to null island
					map.flyTo({center: [124.808596,44.318896], zoom: 18, duration: 12000, essential: true});
			});
		</script>

	</body>
</html>
