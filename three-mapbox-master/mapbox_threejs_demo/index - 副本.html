				rotateX: modelRotate[0],

			// configuration of the custom layer for a 3D model per the CustomLayerInterface
			const customLayer = {

				type: 'custom',
				renderingMode: '3d',
				onAdd: function(map, gl) {
					this.camera = new THREE.Camera();
					this.scene = new THREE.Scene();

					// create two three.js lights to illuminate the model
					const directionalLight = new THREE.DirectionalLight(0xffffff);
					directionalLight.position.set(0, -70, 100).normalize();
					// this.scene.add(directionalLight);

					this.scene.add(new THREE.AmbientLight("#ffffff", 3));

					const directionalLight2 = new THREE.DirectionalLight(0xffffff);
					directionalLight2.position.set(0, 70, 100).normalize();
					// this.scene.add(directionalLight2);


					const dracoLoader = new THREE.DRACOLoader();

					dracoLoader.setDecoderPath('draco/');
					dracoLoader.setDecoderConfig({
						type: 'js'
					});

					// use the three.js GLTF loader to add the 3D model to the three.js scene
					const loader = new THREE.GLTFLoader();
					loader.setDRACOLoader(dracoLoader);
					loader.load(
						'models/3.glb',
						(gltf) => {
							let mesh = gltf.scene;
							// console.log(mesh)
							// mesh.scale.set(1, 1, 1);
							mesh.rotation.y = -0.05 * Math.PI;
							this.scene.add(mesh);
							// methArr.push(mesh);

							loader.load(
								'models/4.glb',
								(gltf) => {

									mesh.rotation.y = -0.05 * Math.PI;
									this.scene.add(mesh);
									// methArr.push(mesh);

									loader.load(
										'models/1.glb',
										(gltf) => {
											let mesh = gltf.scene;
											// console.log(mesh)
											// mesh.scale.set(1, 1, 1);
											mesh.rotation.y = -0.05 * Math.PI;
											this.scene.add(mesh);
											// methArr.push(mesh);
										}
									);
								}
							);
							loader.load(

								(gltf) => {

									// console.log(mesh)
									// mesh.scale.set(1, 1, 1);
									mesh.rotation.y = -0.05 * Math.PI;
									this.scene.add(mesh);
									// methArr.push(mesh);

									loader.load(
										'models/5.glb',
										(gltf) => {
											let mesh = gltf.scene;
											// console.log(mesh)
											// mesh.scale.set(1, 1, 1);
											mesh.rotation.y = -0.05 * Math.PI;
											this.scene.add(mesh);
											// methArr.push(mesh);
										}
									);
								}
							);
						}
					);
					this.map = map;

					// use the Mapbox GL JS map canvas for three.js
					this.renderer = new THREE.WebGLRenderer({
						canvas: map.getCanvas(),
						context: gl,
						antialias: true,
						logarithmicDepthBuffer: true,
					});

					this.renderer.setClearColor(new THREE.Color("#0e0934"));
					this.renderer.autoClear = false;
					this.raycaster = new THREE.Raycaster();

					// threejs场景点击事件
					this.renderer.domElement.addEventListener('click', (event) => {
						event.preventDefault();
						mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
						mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
						// 通过摄像机和鼠标位置更新射线
						this.raycaster.setFromCamera(mouse, this.camera);
						// 计算物体和射线的焦点
						const intersects = this.raycaster.intersectObjects(methArr.children, true);
						if (intersects.length > 0) {
							// intersects[0].object.material.wireframe = true;
						}
					})
				},
				render: function(gl, matrix) {
					const rotationX = new THREE.Matrix4().makeRotationAxis(
						new THREE.Vector3(1, 0, 0),
						modelTransform.rotateX
					);
					const rotationY = new THREE.Matrix4().makeRotationAxis(
						new THREE.Vector3(0, 1, 0),
						modelTransform.rotateY
					);
					const rotationZ = new THREE.Matrix4().makeRotationAxis(
						new THREE.Vector3(0, 0, 1),
						modelTransform.rotateZ
					);

					const m = new THREE.Matrix4().fromArray(matrix);
					const l = new THREE.Matrix4()
						.makeTranslation(
							modelTransform.translateX,
							modelTransform.translateY,
							modelTransform.translateZ
						)
						.scale(
							new THREE.Vector3(
								modelTransform.scale,
								-modelTransform.scale,
								modelTransform.scale
							)
						)
						.multiply(rotationX)
						.multiply(rotationY)
						.multiply(rotationZ);

					this.camera.projectionMatrix = m.multiply(l);
					this.renderer.resetState();

					const freeCamera = this.map.getFreeCameraOptions();
					let cameraPosition = new THREE.Vector4(freeCamera.position.x, freeCamera.position.y, freeCamera
						.position.z, 1);
					cameraPosition.applyMatrix4(l.invert());
					let direction = mouse.clone().applyMatrix4(this.camera.projectionMatrix.clone().invert());
					direction.divideScalar(direction.w);
					this.raycaster.set(cameraPosition, direction.sub(cameraPosition).normalize());

					if (methArr.length < 1) return;

					const intersects = this.raycaster.intersectObjects(methArr.children, true);
					console.log('Intersection count:', intersects.length)

					for (let i = 0; i < intersects.length; i++) {

						// intersects[i].object.material.wireframe = false;
					}
					this.map.triggerRepaint();
				}

							map.addImage('custom-marker', image);
							// Add a GeoJSON source with 2 points

					map.addLayer({

							'line-width': 3,

							// to set the line-color to a feature property value.
							'line-color': ['get', 'color']
